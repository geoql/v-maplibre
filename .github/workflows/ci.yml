name: 'Continuous Integration'

on:
  workflow_call:
    outputs:
      mapcn-changed:
        description: 'Whether mapcn-vue app files changed'
        value: ${{ jobs.changes.outputs.mapcn }}
      docs-changed:
        description: 'Whether docs app files changed'
        value: ${{ jobs.changes.outputs.docs }}

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      mapcn: ${{ steps.filter.outputs.mapcn }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mapcn:
              - 'apps/mapcn-vue/**'
              - 'packages/v-maplibre/**'
              - 'packages/mapcn-vue/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            docs:
              - 'apps/docs/**'

  quality:
    name: 'Lint & Format'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

  test:
    name: 'Test'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build-lib:
    name: 'Build Library'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @geoql/v-maplibre run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Chunk-graph guard for issue #114: the core entry must be installable
      # with only vue / maplibre-gl / pmtiles. Walks every chunk reachable from
      # dist/index.js (static + dynamic imports) and fails if any optional peer
      # (deck.gl / lidar / wind / starfield / geotiff) is reachable.
      - name: Verify optional peers stay out of core entry
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          import { resolve, dirname, join } from 'node:path';

          const DIST = resolve('packages/v-maplibre/dist');
          const ROOT = join(DIST, 'index.js');

          const OPTIONAL_PEERS = [
            '@deck.gl/core',
            '@deck.gl/layers',
            '@deck.gl/mapbox',
            '@deck.gl/aggregation-layers',
            '@deck.gl/geo-layers',
            '@deck.gl/mesh-layers',
            '@luma.gl/core',
            '@luma.gl/engine',
            '@luma.gl/shadertools',
            '@developmentseed/deck.gl-geotiff',
            '@developmentseed/deck.gl-raster',
            '@developmentseed/deck.gl-zarr',
            '@developmentseed/geotiff',
            '@developmentseed/proj',
            '@geoql/maplibre-gl-starfield',
            'apache-arrow',
            'maplibre-gl-lidar',
            'maplibre-gl-wind',
            'three',
            'zarrita',
          ];
          const isOptionalPeer = (spec) =>
            OPTIONAL_PEERS.some((p) => spec === p || spec.startsWith(`${p}/`));

          // Match both `from '...'` (static) and `import('...')` (dynamic).
          const SPEC_RE = /(?:from\s*|import\s*\(\s*)["']([^"']+)["']/g;

          if (!existsSync(ROOT)) {
            console.error(`[verify-peer-graph] missing ${ROOT} — build the library first.`);
            process.exit(2);
          }

          const visited = new Set();
          const queue = [ROOT];
          const violations = [];

          while (queue.length > 0) {
            const file = queue.shift();
            if (visited.has(file)) continue;
            visited.add(file);

            let code;
            try {
              code = readFileSync(file, 'utf8');
            } catch {
              continue;
            }

            for (const match of code.matchAll(SPEC_RE)) {
              const spec = match[1];
              if (isOptionalPeer(spec)) {
                violations.push({ file: file.replace(`${DIST}/`, ''), spec });
                continue;
              }
              if (spec.startsWith('.')) {
                const target = resolve(dirname(file), spec);
                const candidate = target.endsWith('.js') ? target : `${target}.js`;
                if (existsSync(candidate)) queue.push(candidate);
              }
            }
          }

          if (violations.length > 0) {
            console.error('[verify-peer-graph] FAIL: optional peers reachable from dist/index.js (core entry):');
            for (const v of violations) console.error(`  ${v.file} -> ${v.spec}`);
            console.error(`\nScanned ${visited.size} chunk(s). The core entry must only reference vue / maplibre-gl / pmtiles.`);
            process.exit(1);
          }

          console.log(`[verify-peer-graph] PASS: no optional peers reachable from dist/index.js (scanned ${visited.size} chunk(s)).`);
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lib-dist
          path: packages/v-maplibre/dist/
          retention-days: 1

  build-mapcn:
    name: 'Build mapcn-vue'
    needs: [changes, build-lib]
    if: needs.changes.outputs.mapcn == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download library artifact
        uses: actions/download-artifact@v8
        with:
          name: lib-dist
          path: packages/v-maplibre/dist/

      # ProMap data (apps/mapcn-vue/public/data/promap-data.json) is VENDORED.
      # SimpleMaps.com is behind Cloudflare Bot Fight Mode and 403s any non-browser
      # client, so CI cannot regenerate it. Maintainers regenerate locally — see
      # apps/mapcn-vue/scripts/prepare-promap-data.ts for the workflow.

      - name: Build mapcn-vue
        run: pnpm run build:mapcn
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_PUBLIC_MAPSGURU_API_KEY: ${{ secrets.NUXT_PUBLIC_MAPSGURU_API_KEY }}
          # Public analytics client ID is baked into the client bundle at build
          # time — without it prerendered pages ship clientId:"" and OpenPanel
          # tracking is silently dead in production.
          NUXT_PUBLIC_OPENPANEL_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_OPENPANEL_CLIENT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mapcn-dist
          path: apps/mapcn-vue/.output/
          retention-days: 1
          # .output is a dotfolder; without this the upload silently skips every
          # file (hidden-file exclusion) and deploy jobs fail on empty artifacts.
          include-hidden-files: true

  build-docs:
    name: 'Build Docs'
    needs: [changes, quality]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm run build:docs
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/.output/
          retention-days: 1
          # Same dotfolder pitfall as mapcn-dist above.
          include-hidden-files: true
