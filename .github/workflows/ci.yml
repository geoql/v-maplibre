name: 'Continuous Integration'

on:
  workflow_call:
    outputs:
      mapcn-changed:
        description: 'Whether mapcn-vue app files changed'
        value: ${{ jobs.changes.outputs.mapcn }}
      docs-changed:
        description: 'Whether docs app files changed'
        value: ${{ jobs.changes.outputs.docs }}

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      mapcn: ${{ steps.filter.outputs.mapcn }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # packages/site-shell is the design layer both sites extend:
            # a change to it must rebuild and redeploy both.
            mapcn:
              - 'apps/mapcn-vue/**'
              - 'packages/v-maplibre/**'
              - 'packages/mapcn-vue/**'
              - 'packages/site-shell/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            docs:
              - 'apps/docs/**'
              - 'packages/site-shell/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  quality:
    name: 'Lint & Format'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

  test:
    name: 'Test'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:coverage

      - name: Run app tests
        run: pnpm run test:apps

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  typecheck:
    name: 'Typecheck'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The registry and the apps import @geoql/v-maplibre from its built
      # dist/*.d.ts, so the library is built before the typecheck runs.
      - name: Typecheck
        run: pnpm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  build-lib:
    name: 'Build Library'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @geoql/v-maplibre run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Chunk-graph guard for issues #114 and #187: the core entry must be
      # installable with only vue / maplibre-gl / pmtiles. Walks every chunk
      # reachable from dist/index.js (static + dynamic imports) and fails if
      # any optional peer is reachable. Nitro follows the same graph, so a hit
      # here is a failed `nuxt build` for core-only consumers.
      - name: Verify optional peers stay out of core entry
        run: pnpm --filter @geoql/v-maplibre run verify:peers

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lib-dist
          path: packages/v-maplibre/dist/
          retention-days: 1

  build-mapcn:
    name: 'Build mapcn-vue'
    needs: [changes, build-lib]
    if: needs.changes.outputs.mapcn == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download library artifact
        uses: actions/download-artifact@v8
        with:
          name: lib-dist
          path: packages/v-maplibre/dist/

      # ProMap data (apps/mapcn-vue/public/data/promap-data.json) is VENDORED.
      # SimpleMaps.com is behind Cloudflare Bot Fight Mode and 403s any non-browser
      # client, so CI cannot regenerate it. Maintainers regenerate locally — see
      # apps/mapcn-vue/scripts/prepare-promap-data.ts for the workflow.

      - name: Build mapcn-vue
        run: pnpm run build:mapcn
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_PUBLIC_MAPSGURU_API_KEY: ${{ secrets.NUXT_PUBLIC_MAPSGURU_API_KEY }}
          # Public analytics client ID is baked into the client bundle at build
          # time — without it prerendered pages ship clientId:"" and OpenPanel
          # tracking is silently dead in production.
          NUXT_PUBLIC_OPENPANEL_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_OPENPANEL_CLIENT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mapcn-dist
          path: apps/mapcn-vue/.output/
          retention-days: 1
          # .output is a dotfolder; without this the upload silently skips every
          # file (hidden-file exclusion) and deploy jobs fail on empty artifacts.
          include-hidden-files: true

  build-docs:
    name: 'Build Docs'
    needs: [changes, quality]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm run build:docs
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/.output/
          retention-days: 1
          # Same dotfolder pitfall as mapcn-dist above.
          include-hidden-files: true
