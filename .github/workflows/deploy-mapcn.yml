name: Deploy mapcn-vue

on:
  workflow_call:
    inputs:
      skip-build:
        description: 'Download build artifact from CI instead of rebuilding'
        default: false
        required: false
        type: boolean
  workflow_dispatch:

concurrency:
  group: deploy-mapcn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Download build artifact
        if: inputs.skip-build == true
        uses: actions/download-artifact@v8
        with:
          name: mapcn-dist
          path: apps/mapcn-vue/.output/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        if: inputs.skip-build != true
        run: pnpm --filter @geoql/v-maplibre run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # ProMap data is VENDORED — see comment in ci.yml + prepare-promap-data.ts header.

      - name: Build mapcn-vue
        if: inputs.skip-build != true
        run: pnpm run build:mapcn
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_PUBLIC_MAPSGURU_API_KEY: ${{ secrets.NUXT_PUBLIC_MAPSGURU_API_KEY }}
          # Same as ci.yml: bakes the public OpenPanel client ID into the
          # prerendered client bundle; empty means analytics silently dead.
          NUXT_PUBLIC_OPENPANEL_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_OPENPANEL_CLIENT_ID }}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/mapcn-vue
        run: pnpm exec wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
