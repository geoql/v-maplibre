    '@tanstack/vue-table': ^8.21.3
    '@vueuse/core': ^14.3.0
    '@vueuse/nuxt': ^14.3.0
    better-sqlite3: ^12.11.1
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
