packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  # Nuxt 4.5 declares unhead "^3.1.8", but Unhead 3.1.8 ships an invalid
  # unhead/dist/stream/iife.mjs that the Cloudflare preset build cannot parse,
  # aborting the CF Workers build (nuxt/nuxt#35670). Fixed in Unhead 3.2.0+;
  # keep the floor above 3.2.1 so the Cloudflare build always resolves a good copy.
  unhead: '>=3.4.3'
  # docus -> @nuxtjs/mcp-toolkit + devframe pull h3@2.0.1-rc.x, which wins the
  # shamefully-hoist for bare `h3` imports. @nuxt/content + nuxt-llms nitro
  # handlers then mix h3 v1 events with v2 setHeader and every prerender route
  # 500s ("Cannot read properties of undefined (reading 'set')"). mcp-toolkit
  # only peers on h3 >=1.15.11, so pinning to v1 is safe.
  h3: ^1.15.11
  # Exception: devframe (the devtools host pulled in by @nuxt/fonts 1 and
  # fontless) is built on the h3 v2 API (`H3`, `defineHandler`,
  # `toNodeHandler`). Forcing it to v1 crashes `nuxt dev` at startup with
  # "does not provide an export named 'H3'". It runs only in the dev server,
  # so it gets its own h3 v2 while everything else stays on v1.
  devframe>h3: ^2.0.5
  # Single-version pins to avoid dual-resolution at docs `nuxt prepare`:
  # docus@5.11 pulls @nuxt/content@3.13.0 (no zod3 chunk -> defineCollection
  # throws via the zod3 placeholder), while @nuxt/ui pulls @nuxt/content@3.14.0.
  # Pinning to 3.14 + zod 4 makes every path use the zod4 chunk.
  '@nuxt/content': ^3.16.2
  zod: ^4.6.7
  # A second @vue/* generation (3.5.41) survived the last dependency sweep
  # inside @vue/test-utils' peer set. Two Vue runtimes in one SSR bundle lose
  # Nuxt's async context: the prerenderer aborts every route with NUXT_E1001
  # and ships no index.html. Keep the SSR renderer on `vue`'s line.
  '@vue/server-renderer': ^3.5.44
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

allowBuilds:
  '@mongodb-js/zstd': true
  '@parcel/watcher': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  maplibre-gl: true
  node-liblzma: true
  sharp: true
  vue-demi: true
  workerd: true

# Catalogs centralize dependency versions across the monorepo.
# Sub-packages reference these with `catalog:` (default) or `catalog:<name>`.
# Requires pnpm v9.5+ (this repo pins pnpm v11).
catalogs:
  default:
    maplibre-gl: ^6.15.0
    typescript: ^6.0.3
    vue: ^3.5.44
    vue-tsc: ^3.3.13
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vitest: 5.0.5
    vite-plus: 1.4.0
    '@vitest/coverage-v8': 5.0.5

  pkg:mapcn-vue:
    '@types/node': ^26.6.5
    shadcn-vue: ^2.8.2

  app:docs:
    '@comark/nuxt': ^0.8.1
    # Direct dep so `.nuxt/content/types.d.ts` can augment '@nuxt/content'.
    # Without it the augmentation becomes an unrelated ambient module, docus
    # sees an empty `Collections`, and `DocsPage` resolves to `never`.
    '@nuxt/content': ^3.16.2
    '@nuxt/scripts': ^1.3.12
    '@openpanel/nuxt': ^0.4.2
    agents: ^0.30.1
    better-sqlite3: ^13.0.3
    docus: ^5.15.0
    nuxt: ^4.6.2
    wrangler: ^4.152.0
    # Required by docus → @nuxt/content collection schema generation.
    # CI fails on `nuxt prepare` without these because @nuxt/content 3.13.x
    # peer-requires zod (not bundled). Local installs sometimes resolve to
    # 3.14.x which sidesteps the requirement, but CI consistently pulls 3.13.x.
    zod: ^4.6.7
    zod-to-json-schema: ^3.25.2

  app:mapcn-vue:
    '@nuxt/schema': ^4.6.2
    '@nuxtjs/robots': ^7.0.2
    '@nuxt/scripts': ^1.3.12
    '@openpanel/nuxt': ^0.4.2
    '@openpanel/sdk': ^1.3.2
    '@nuxtjs/sitemap': ^9.1.0
    '@types/geojson': ^7946.0.16
    maplibre-gl-wind: ^0.2.1
    'nuxt-schema-org': ^7.0.1
    '@deck.gl/aggregation-layers': ^9.4.0
    '@deck.gl/core': ^9.4.0
    '@deck.gl/geo-layers': ^9.4.0
    '@deck.gl/layers': ^9.4.0
    '@deck.gl/mapbox': ^9.4.0
    '@deck.gl/mesh-layers': ^9.4.0
    '@developmentseed/deck.gl-geotiff': ^0.9.0
    '@developmentseed/deck.gl-raster': ^0.9.0
    '@developmentseed/deck.gl-zarr': ^0.9.0
    '@developmentseed/geotiff': ^0.9.0
    '@developmentseed/proj': ^0.9.0
    apache-arrow: ^21.2.0
    # Pure-JS Zstandard decompressor. zarrita's `zstd` codec resolves to
    # numcodecs, whose Emscripten build needs `unsafe-eval` and therefore
    # cannot run under this app's Content-Security-Policy.
    fzstd: ^0.1.1
    zarrita: ^0.7.5
    lerc: ^4.2.0
    '@geoql/maplibre-gl-starfield': ^0.1.2
    '@geoql/maplibre-gl-snow': ^0.0.10
    '@geoql/maplibre-gl-compare': ^0.0.4
    '@sparkjsdev/spark': ^2.4.0
    '@dvt3d/maplibre-three-plugin': ^1.7.1
    '3d-tiles-renderer': ^0.5.3
    '3d-tiles-rendererjs-3dgs-plugin': ^0.3.0
    gaussian-splat-lite: ^1.4.1
    '@iconify-json/lucide': ^1.2.147
    '@iconify-json/simple-icons': ^1.2.100
    '@iconify-json/vscode-icons': ^1.2.93
    '@loaders.gl/3d-tiles': ^4.5.4
    '@loaders.gl/core': ^4.5.4
    '@loaders.gl/gltf': ^4.5.4
    '@luma.gl/core': ^9.4.2
    '@luma.gl/engine': ^9.4.2
    '@luma.gl/gltf': ^9.4.2
    '@luma.gl/shadertools': ^9.4.2
    '@math.gl/core': ^4.1.0
    '@math.gl/types': ^4.1.0
    '@resvg/resvg-js': ^2.6.2
    '@resvg/resvg-wasm': ^2.6.2
    '@nuxt/content': ^3.16.2
    '@nuxt/icon': ^2.6.1
    '@nuxt/fonts': ^1.2.0
    '@nuxtjs/color-mode': ^4.0.1
    # Pinned: only 7.x supports Tailwind v4. Do NOT bump to 6.x.
    '@nuxtjs/tailwindcss': 7.0.0-beta.1
    '@turf/turf': ^7.4.0
    '@rollup/plugin-inject': ^5.0.5
    '@tanstack/vue-table': ^9.3.1
    '@vueuse/core': ^15.0.0
    '@vueuse/nuxt': ^15.0.0
    better-sqlite3: ^13.0.3
    '@types/better-sqlite3': ^9.6.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    flatbush: ^4.6.2
    jszip: ^3.10.2
    maplibre-gl-interpolate-heatmap: 0.1.4
    maplibre-gl-lidar: ^0.21.0
    motion-v: ^2.8.0
    nuxt: ^4.6.2
    nuxt-llms: ^0.3.0
    nuxt-og-image: ^7.0.7
    nuxt-security: ^2.6.0
    proj4: ^2.22.0
    reka-ui: ^2.11.0
    satori: ^0.63.2
    shadcn-nuxt: ^2.8.2
    shiki: ^4.5.0
    tailwind-merge: ^3.7.0
    tailwindcss: ^4.3.3
    tailwindcss-animate: ^1.0.7
    three: ^0.186.1
    tw-animate-css: ^1.4.0
    vue-sonner: ^2.0.9
    wrangler: ^4.152.0
    terra-draw: ^1.38.0
    terra-draw-maplibre-gl-adapter: ^1.5.0
    yoga-wasm-web: ^0.3.3

minimumReleaseAgeExclude:
  - flatbush
  - nuxt
  - '@nuxt/*'
  - '@vueuse/*'
  - '@tanstack/*'
  - vue
  - '@vue/*'
  - '@sparkjsdev/spark@2.4.0'

patchedDependencies:
  # @sparkjsdev/spark no longer needs a patch: 2.2.0 dropped its use of the
  # deprecated THREE.Clock (the 2.1.0 patch only silenced the three r183+ warn).
  # Temporary until upstream ships the fixes. Remove when released:
  # opengeos/maplibre-gl-lidar#111 (CSP-safe LAZ), #112 (WebGL context leak), #113 (teardown race)
  maplibre-gl-lidar@0.21.0: patches/maplibre-gl-lidar@0.21.0.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
