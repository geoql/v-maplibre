minimumReleaseAgeExclude:
  - flatbush
  - nuxt
  - '@nuxt/*'
  - '@vueuse/*'
  - '@tanstack/*'
  - vue
  - '@vue/*'

patchedDependencies:
  maplibre-gl-interpolate-heatmap@0.1.3: patches/maplibre-gl-interpolate-heatmap@0.1.3.patch
