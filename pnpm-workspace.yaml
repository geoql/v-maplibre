    jszip: ^3.10.1
    maplibre-gl-interpolate-heatmap: 0.1.3
    maplibre-gl-lidar: ^0.16.2
    motion-v: ^2.3.0
    nuxt: ^4.5.0
    nuxt-llms: ^0.2.0
    nuxt-og-image: ^6.7.4
    nuxt-security: ^2.6.0
    proj4: ^2.20.9
    reka-ui: ^2.10.1
    satori: ^0.28.2
